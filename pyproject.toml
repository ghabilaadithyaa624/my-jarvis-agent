[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-personal-ai"
version = "1.0.0"
description = "JARVIS Personal AI — Local Privacy-First Voice Operator & Desktop Agent for Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Core only: everything else is an opt-in extra below.
    "httpx>=0.26.0,<1.0",
    "pydantic>=2.5.0,<3.0",
    "psutil>=5.9.8,<8.0",
    "PyYAML>=6.0.1,<7.0",
    "numpy>=1.26.0,<3.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
voice = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "piper-tts>=1.2.0",
    "pyttsx3>=2.90",
]
windows = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "mss>=9.0.1",
    "Pillow>=10.2.0",
    "Send2Trash>=1.8.3",
]
documents = [
    "python-docx>=1.1.0",
    "pypdf>=4.1.0",
    "openpyxl>=3.1.2",
]
browser = [
    "playwright>=1.43.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.6.0",
    # Used by the .docx round-trip test in jarvis/tests/test_phase4_apps_and_filesystem.py
    "python-docx>=1.1.0",
]
full = [
    "jarvis-personal-ai[gui,voice,windows,documents,browser]",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["jarvis/tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
# Minimal, stable rule set: real errors only (syntax errors + undefined names +
# unused imports). Style churn is deliberately not enforced.
target-version = "py310"
line-length = 120
exclude = [".venv", "venv", "build", "dist", "eval/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"jarvis/tests/*" = ["F401"]
