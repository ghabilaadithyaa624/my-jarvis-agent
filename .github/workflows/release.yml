name: Release

# Build the standalone Windows executable on a tag like v1.0.0 and attach the
# zip to a GitHub Release. Tags are the only trigger, so a normal push never
# publishes anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual dry run (builds + zips, no release created)

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows exe (PyInstaller)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + full Windows stack + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev]"

      - name: Verify the test suite before packaging
        run: python -m pytest jarvis/tests -q

      - name: Build onedir bundle with scripts/build_exe.ps1
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Verify the executable exists
        shell: pwsh
        run: |
          $exe = "dist\JarvisPersonalAI\JarvisPersonalAI.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Zip the bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "manual-${{ github.run_number }}" }
          $zip = "JarvisPersonalAI-$version-windows-x64.zip"
          Compress-Archive -Path "dist\JarvisPersonalAI\*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $zip | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisPersonalAI-windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release and attach the zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          Standalone Windows 11 build (PyInstaller onedir). Unzip and run JarvisPersonalAI.exe.

          Requirements:
          - Ollama installed and running locally with a 6 GB-friendly model, e.g. `ollama pull qwen2.5:7b`
          - Optional Piper voices in `%USERPROFILE%\.jarvis\voices\` (English and Tamil)

          See the README for install, verification (--doctor / --self-test) and the security model.
          '@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" "$env:ZIP_NAME" `
            --title "JARVIS Personal AI ${{ github.ref_name }}" `
            --notes-file release-notes.md
