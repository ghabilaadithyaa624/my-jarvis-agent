[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-personal-ai"
version = "1.0.0"
description = "JARVIS Personal AI — Local Privacy-First Voice Operator & Desktop Agent for Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "psutil>=5.9.8",
    "PyYAML>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
voice = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "piper-tts>=1.2.0",
    "pyttsx3>=2.90",
]
windows = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "mss>=9.0.1",
    "Pillow>=10.2.0",
    "Send2Trash>=1.8.3",
]
documents = [
    "python-docx>=1.1.0",
    "pypdf>=4.1.0",
    "openpyxl>=3.1.2",
]
browser = [
    "playwright>=1.43.0",
]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.6.0",
]
full = [
    "jarvis-personal-ai[gui,voice,windows,documents,browser]",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["jarvis/tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
