name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff>=0.6.0"
      - name: Ruff
        run: ruff check .

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      # Qt must never try to open a real window on a headless runner.
      QT_QPA_PLATFORM: offscreen
      # Keep the suite offline & deterministic: no telemetry, no proxies.
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + dev tooling (no GUI/voice/Ollama needed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show environment
        run: |
          python --version
          python -m pip list
      - name: Run test suite
        run: python -m pytest jarvis/tests -q

  core-install-smoke:
    name: Core-only install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only (no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Agent imports and doctor runs without optional packages
        shell: bash
        run: |
          python -c "import jarvis, jarvis.logs.logger; print('core import OK', jarvis.__version__)"
          python -m jarvis --doctor > doctor.txt
          cat doctor.txt
